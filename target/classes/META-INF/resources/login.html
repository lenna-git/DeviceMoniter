<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>用户登录</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="sysusername">用户名:</label>
            <input type="text" id="sysusername" name="sysusername" required>
            <div class="error" id="usernameError"></div>
        </div>
        <div class="form-group">
            <label for="sysuserpassword">密码:</label>
            <input type="password" id="sysuserpassword" name="sysuserpassword" required>
            <div class="error" id="passwordError"></div>
        </div>
        <button type="submit">登录</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        // 获取表单元素
        const sysusername = document.getElementById('sysusername').value.trim();
        const sysuserpassword = document.getElementById('sysuserpassword').value.trim();

        // 清除之前的错误信息
        document.getElementById('usernameError').textContent = '';
        document.getElementById('passwordError').textContent = '';

        // 简单验证
        let isValid = true;
        if (sysusername === '') {
            document.getElementById('usernameError').textContent = '请输入用户名';
            isValid = false;
        }
        if (sysuserpassword === '') {
            document.getElementById('passwordError').textContent = '请输入密码';
            isValid = false;
        }

        if (isValid) {
            const xhr = new XMLHttpRequest();
            var url='/sysuseraction/login'+'?sysusername='+sysusername+'&sysuserpassword='+sysuserpassword;
            xhr.open('GET', url, true);
            xhr.responseType = 'json';
            // 4. 监听请求完成事件
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    // 获取解析后的对象
                        const responseObject = xhr.response;
                        if(responseObject==null){
                            alert("登录失败");
                        }else{
                        // 5. 存储对象到 localStorage
                        sessionStorage.setItem('SYS_USER', JSON.stringify(xhr.response));
                        console.log('数据已存储到 sessionStorage-SYSUSER', JSON.stringify(xhr.response));
                        window.location.href="index.html";
                    }
                } else {
                    console.error('请求失败，状态码：', xhr.status);
                }
            };

            // 处理请求错误
            xhr.onerror = function() {
                console.error('请求发生错误');
            };

            // 发送请求
            xhr.send();


            // xhr.onreadystatechange = function() {
            //     if (xhr.readyState === 4 && xhr.status === 200) {
            //         console.log('response:'+xhr.responseText);
            //         if(xhr.responseText=='true'){
            //             sessionStorage.setItem('message', 'user111');
            //             window.location.href="index.html";
            //         }else {
            //             alert("登录失败", "提交的表单数据无效,请检查!");
            //         }
            //
            //         // document.getElementById('result').innerHTML = xhr.responseText;
            //     }
            // };
            // xhr.send();
        }
    });
</script>
</body>
</html>
